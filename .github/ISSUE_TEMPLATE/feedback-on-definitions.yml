name: Feedback on Definitions
description: Feedback on published capability or media definitions.
title: "<short summary>"
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        For brand-new definitions please use [Add Definition](../../issues/new?template=add-definition.yml).

        This template is for everything else: feedback on an existing capability or media definition, a question about why two URNs are shaped a particular way, a request to revise or remove a definition, or a feature request for the registry.
  - type: textarea
    id: summary
    attributes:
      label: What's going on?
      description: Describe the bug, question, or request as clearly as you can. If you're reporting something specific, include URNs, links to capdag.com pages, and steps to reproduce.
    validations:
      required: true
